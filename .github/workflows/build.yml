name: Build Nomea Client

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Build Mod
        run: gradle build

      - name: Upload Nomea JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nomea-Client-JAR
          path: build/libs/*.jar
